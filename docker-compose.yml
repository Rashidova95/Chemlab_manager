services:

  db:
    image: postgres:15
    container_name: chemlab_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: chemlab_backend
    restart: always
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    environment:
      DB_HOST: db
    # E'tibor bering: 8000-port endi tashqariga ochilmaydi — faqat nginx
    # orqali kiriladi (xavfsizlik uchun). Agar nginx'siz sinab ko'rmoqchi
    # bo'lsangiz, vaqtincha "ports: - '8000:8000'" qatorini qo'shing.
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: chemlab_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Boshida nginx.http-only.conf, sertifikat olingandan keyin nginx.ssl.conf
      - ./nginx/nginx.http-only.conf:/etc/nginx/conf.d/default.conf
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: chemlab_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Bu xizmat doim ishlab turmaydi — sertifikat olish/yangilash uchun
    # qo'lda ishga tushiriladi (README'dagi buyruqlarga qarang)
    entrypoint: "true"

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_certs:
  certbot_www:
